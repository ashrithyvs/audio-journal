// Native-only library: builds whisper.cpp (ADR-016) into libaj_whisper.so for
// Audio Journal's app-owned, on-device transcription. Source is fetched from a
// SHA-256-pinned release archive; nothing from the Hybrid AI SDK is used.
apply plugin: 'com.android.library'

android {
  namespace 'com.audiojournal.speech.engine'
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    ndk { abiFilters 'arm64-v8a', 'x86_64' }
    externalNativeBuild {
      cmake {
        // Inference must be fully optimized in every variant.
        arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.31.6'
    }
  }
}
