apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.audiojournal"
    defaultConfig {
        applicationId "com.audiojournal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // Device tests for the ADR-017 vault and encrypted store.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // Device suites only (the AJ-2 voice-entry journey): release-like,
        // with the JS bundled, plus the test audio input in src/e2e. Never
        // distributed; release and debug compile a stub instead.
        e2e {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            // As for release: the React Native plugin sets this only for the
            // build types it knows.
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

// AJ ADR-022: the SDK-defined `audio.transcribe@1` model pack, exactly the bytes
// accepted by RI-REV-2B (SDK RI-2 record §16), copied from the pinned local
// package directory into APK assets. Nothing is downloaded or rebuilt; a missing
// file or any size or SHA-256 difference fails the build. The app checks them
// again on device, and the SDK checks the artifact before loading it.
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

def transcriptionPack = [
    'ggml-tiny.en-q5_1.bin': [sha256: 'c77c5766f1cef09b6b7d47f21b546cbddd4157886b3b5d6d4f709e91e66c7c2b', bytes: 32166155L],
    'sdk.whisper.tiny-en-q5-1.profile.json': [sha256: '5d722be29fe7feae78c7880f12f7e6eae35458e9237753941a3c7d7e54a4e50b'],
    'audio-transcribe.tiny-en.package.json': [sha256: 'f2f59c4d576acae207646a67b556123c3057c9798a5b97c388b9bef152696544'],
]
def transcriptionPackDir = rootProject.file(findProperty('hybridAi.transcriptionPackDir'))
def transcriptionAssets = layout.buildDirectory.dir('generated/transcription-pack')

def fileSha256 = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[1 << 20]
        int read
        while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

def provisionTranscriptionPack = tasks.register('provisionTranscriptionPack') {
    inputs.files(transcriptionPack.keySet().collect { new File(transcriptionPackDir, it) })
    outputs.dir(transcriptionAssets)
    doLast {
        def target = new File(transcriptionAssets.get().asFile, 'hybrid-ai-transcription')
        target.deleteDir()
        target.mkdirs()
        transcriptionPack.each { name, pin ->
            def source = new File(transcriptionPackDir, name)
            if (!source.isFile()) throw new GradleException("transcription pack file missing: ${name}")
            if (pin.bytes != null && source.length() != pin.bytes) {
                throw new GradleException("transcription pack ${name}: ${source.length()} bytes, expected ${pin.bytes}")
            }
            def out = new File(target, name)
            Files.copy(source.toPath(), out.toPath(), StandardCopyOption.REPLACE_EXISTING)
            def actual = fileSha256(out)
            if (actual != pin.sha256) {
                out.delete()
                throw new GradleException("transcription pack ${name} SHA-256 ${actual}, expected ${pin.sha256}")
            }
        }
    }
}
android.sourceSets.main.assets.srcDirs += transcriptionAssets
tasks.named('preBuild') { dependsOn provisionTranscriptionPack }

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // The packaged Hybrid AI SDK (pinned AAR): transcription through its public
    // Kotlin API only (AJ ADR-021/022). Audio Journal links no model runtime.
    implementation(project(':hybrid-ai-android'))
    // ADR-017: native vault (reference libargon2), encrypted journal store, biometrics.
    implementation(project(':vault-crypto'))
    implementation("net.zetetic:sqlcipher-android:4.19.1@aar")
    implementation("androidx.sqlite:sqlite:2.7.0")
    implementation("androidx.biometric:biometric:1.1.0")
    testImplementation("junit:junit:4.13.2")
    // Real org.json for JVM tests (android.jar ships only stubs).
    testImplementation("org.json:json:20240303")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
